services:
  econorte.services:
    image: econorte.services:dev
    build:
      context: .
      dockerfile: Econorte.Services/Dockerfile
    ports:
      - "32771:8080"
      - "32772:8081"
    volumes:
      - ./Econorte.Services/:/app/Econorte.Services
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlexpress,1433;Initial Catalog=Econorte_Dev;Persist Security Info=True;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true;User ID=sa;Password=Password123!
    depends_on:
      - sqlexpress

  econorte.website:
    image: econorte.website:dev
    build:
      context: .
      dockerfile: Econorte.WebSite/Dockerfile
    ports:
      - "32769:8080"
      - "32770:8081"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./Econorte.WebSite/:/app/Econorte.WebSite
    depends_on:
      - econorte.services

  sqlexpress:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: econorte.sqlexpress
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "32773:1433"
    volumes:
      - econorte-sql:/var/opt/mssql
    restart: always

volumes:
  econorte-sql:
